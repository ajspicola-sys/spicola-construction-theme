<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Mockup — FLYGO Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0d0d;
    --page-bg: #fdfdfd;
    --card-radius: 26px;
    /* white frame thickness: 14px up to 1280px screens, grows to 22px by ~1920px */
    --frame-bw: clamp(14px, calc(14px + (100vw - 1280px) * 0.0125), 22px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    /* the hero's 100vw full-bleed includes the scrollbar width — clip it */
    overflow-x: hidden;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ============ SPICOLA HEADER (copied from theme) ============ */
  .hwh-header { position: relative; z-index: 200; }

  .hwh-topbar { background: #0F2440; height: 40px; overflow: hidden; }
  .hwh-topbar__inner { max-width: 1280px; margin: 0 auto; padding: 0 clamp(1.25rem, 1rem + 2vw, 3rem); display: flex; align-items: center; justify-content: space-between; height: 100%; gap: 1.5rem; }
  .hwh-topbar__left { display: flex; align-items: center; gap: .75rem; flex-shrink: 0; }
  .hwh-topbar__right { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
  .hwh-topbar__item { display: flex; align-items: center; gap: .4rem; font-family: 'Inter', sans-serif; font-size: .7rem; font-weight: 500; color: rgba(255,255,255,.65); white-space: nowrap; text-decoration: none; transition: color .2s ease; }
  .hwh-topbar__item--phone { color: #fff; font-weight: 700; }
  .hwh-topbar__item--phone:hover { color: #F22F3A; }
  .hwh-topbar__sep { color: rgba(255,255,255,.2); font-size: .75rem; }
  .hwh-topbar__search { display: flex; align-items: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 9999px; overflow: hidden; }
  .hwh-topbar__search-input { background: transparent; border: none; outline: none; padding: .25rem .75rem; font-family: 'Inter', sans-serif; font-size: .7rem; color: #fff; width: 160px; }
  .hwh-topbar__search-input::placeholder { color: rgba(255,255,255,.4); }
  .hwh-topbar__search-btn { background: transparent; border: none; cursor: pointer; padding: .25rem .6rem .25rem 0; color: rgba(255,255,255,.5); display: flex; align-items: center; }
  .hwh-topbar__social { color: rgba(255,255,255,.5); transition: color .2s ease; display: flex; align-items: center; padding: .2rem; }
  .hwh-topbar__social:hover { color: #F22F3A; }

  .hwh-nav-bar { background: rgba(255,255,255,.97); box-shadow: 0 2px 20px rgba(0,0,0,.07); padding: .85rem 0; }
  .hwh-nav-bar__inner { max-width: 1280px; margin: 0 auto; padding: 0 clamp(1.25rem, 1rem + 2vw, 3rem); display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
  .hwh-nav__logo { display: flex; align-items: center; flex-shrink: 0; text-decoration: none; }
  .hwh-nav__logo-img { height: 44px; width: auto; display: block; }
  .hwh-nav { flex: 1; display: flex; justify-content: center; }
  .hwh-nav__links { display: flex; align-items: center; justify-content: center; gap: .1rem; list-style: none; padding: 0; margin: 0; }
  .hwh-nav__link { display: flex; align-items: center; gap: 4px; padding: .5rem 1rem; font-family: 'Inter', sans-serif; font-size: .83rem; font-weight: 500; color: #0F2440; text-decoration: none; border-radius: 9999px; transition: all .25s ease; white-space: nowrap; position: relative; }
  .hwh-nav__link:hover { color: #F22F3A; background: rgba(242,47,58,.06); }
  .hwh-nav__item--active > .hwh-nav__link { color: #F22F3A; }
  .hwh-nav__item--active > .hwh-nav__link::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: #F22F3A; }
  .hwh-nav__arrow { font-size: .55rem; opacity: .5; }
  .hwh-nav__actions { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
  .hwh-nav__call { width: 36px; height: 36px; border-radius: 50%; background: rgba(242,47,58,.08); color: #F22F3A; display: flex; align-items: center; justify-content: center; transition: all .25s ease; flex-shrink: 0; }
  .hwh-nav__call:hover { background: #F22F3A; color: #fff; transform: scale(1.08); }
  .hwh-btn { display: inline-flex; align-items: center; gap: .5rem; padding: .9rem 2rem; font-family: 'Inter', sans-serif; font-size: .82rem; font-weight: 700; letter-spacing: .04em; text-decoration: none; border-radius: 9999px; border: 2px solid transparent; cursor: pointer; transition: all .3s ease; white-space: nowrap; }
  .hwh-btn--red { background: #F22F3A; color: #fff; border-color: #F22F3A; box-shadow: 0 6px 24px rgba(242,47,58,.35); }
  .hwh-btn--red:hover { background: #AF2D37; border-color: #AF2D37; transform: translateY(-2px); }
  .hwh-btn--sm { padding: .6rem 1.3rem; font-size: .75rem; }

  /* ============ HERO ============ */
  .hero {
    /* full width — breaks out of the centered wrap, keeps side padding */
    width: 100vw;
    margin-left: calc(50% - 50vw);
    padding: 28px 48px 60px;
  }

  .hero-card {
    position: relative;
    border-radius: var(--card-radius);
    overflow: hidden;
    aspect-ratio: 1120 / 400;
    /* stop growing on ultrawide monitors */
    max-width: 1760px;
    margin: 0 auto;
    /* Spicola job-site photo with a light dark overlay for text contrast */
    background:
      linear-gradient(0deg, rgba(15, 36, 64, 0.5), rgba(15, 36, 64, 0.5)),
      url('https://spicolaconstruction.com/wp-content/uploads/2026/07/AdobeStock_323695209-scaled.jpeg') center / cover no-repeat;
    background-color: #45566e;
  }

  /* left box — solid white fill, holds the tagline + headline */
  .hero-panel {
    position: absolute;
    top: 6%;
    bottom: 6%;
    left: 2.5%;
    width: 41%;
    background: #fff;
    /* square on the right where it meets the frame */
    border-radius: 26px 0 0 26px;
    z-index: 2;
  }

  /* plane layer retired — the job-site photo fills the whole card now */
  .hero-plane { display: none; }

  /* white outlined frame on the right */
  /* right box — see-through, thick white border, sky + plane show through.
     left edge tucks slightly under the white panel so the two boxes always
     read as one connected shape at any screen width */
  .hero-frame {
    position: absolute;
    top: 6%;
    left: 42%;
    right: 2.5%;
    height: 88%;
    border: var(--frame-bw) solid #fff;
    /* square on the left where it meets the panel */
    border-radius: 0 26px 26px 0;
    z-index: 1;
    pointer-events: none;
  }

  /* text is anchored to the white panel, so it scales with it */
  .hero-tagline {
    position: absolute;
    top: 10%;
    left: 7.5%;
    max-width: 62%;
    font-size: clamp(12px, 0.95vw, 15px);
    line-height: 1.65;
    font-weight: 500;
    color: #2b2b2b;
  }

  .hero-title {
    position: absolute;
    left: 7.5%;
    bottom: 25%;
    max-width: 88%;
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(32px, 4.9vw, 72px);
    line-height: 0.98;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  /* cutout guy — anchored to the frame itself: always centered, feet on the
     frame's inner bottom edge, hard hat pops out over the top border only */
  .hero-guy {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    height: 106%;
    width: auto;
    max-width: 82%;
    object-fit: contain;
    object-position: bottom center;
    pointer-events: none;
  }

  /* CTA row inside the white panel, under the headline */
  .hero-cta {
    position: absolute;
    left: 7.5%;
    bottom: 8%;
    display: flex;
    align-items: center;
    gap: 1.1rem;
  }
  .hero-cta__call {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    font-family: 'Inter', sans-serif;
    font-size: .85rem;
    font-weight: 700;
    color: #0F2440;
    text-decoration: none;
    white-space: nowrap;
    transition: color .2s ease;
  }
  .hero-cta__call:hover { color: #F22F3A; }

  /* ============ RESPONSIVE ============ */

  /* mid-size laptops / small desktops: shorter card needs a smaller headline */
  @media (min-width: 861px) and (max-width: 1150px) {
    .hero { padding: 24px 32px 48px; }
    .hero-card { min-height: 350px; }
    .hero-title { font-size: clamp(28px, 4.1vw, 46px); }
    .hero-cta { gap: .8rem; }
    .hwh-btn--red { padding: .7rem 1.4rem; font-size: .75rem; }
  }

  /* tablets & phones: stack — framed photo on top, white panel below */
  @media (max-width: 860px) {
    .hwh-nav { display: none; }
    .hwh-topbar__search, .hwh-topbar__social { display: none; }
    .hwh-topbar__item:not(.hwh-topbar__item--phone) { display: none; }
    .hwh-topbar__sep { display: none; }
    .hwh-nav__logo-img { height: 46px; }

    .hero { padding: 16px 16px 40px; }
    .hero-card {
      aspect-ratio: auto;
      height: auto;
      display: flex;
      flex-direction: column;
      /* top padding gives the hard hat room to pop above the frame */
      padding: 44px 14px 14px;
      border-radius: 20px;
    }
    .hero-frame {
      position: relative;
      inset: auto;
      order: 1;
      width: auto;
      height: clamp(240px, 62vw, 340px);
      border-width: 10px;
      /* square bottom — connects into the white panel below */
      border-radius: 18px 18px 0 0;
    }
    .hero-guy { height: 110%; max-width: 88%; }
    .hero-panel {
      position: relative;
      inset: auto;
      order: 2;
      width: auto;
      /* butt up against the frame so the boxes read as one shape */
      margin-top: -1px;
      border-radius: 0 0 18px 18px;
      padding: 24px 22px 26px;
    }
    .hero-tagline { position: static; max-width: none; margin: 0 0 14px; font-size: 12px; }
    .hero-title { position: static; max-width: none; margin: 0 0 20px; font-size: clamp(34px, 10.5vw, 48px); }
    .hero-cta { position: static; flex-wrap: wrap; gap: .8rem; }
  }

  /* phones: compact header */
  @media (max-width: 560px) {
    .hwh-topbar__right { display: none; }
    .hwh-nav-bar__inner { gap: .75rem; padding: 0 1rem; }
    .hwh-nav__logo-img { height: 34px; }
    .hwh-nav__call { display: none; }
    .hwh-btn--sm { padding: .55rem 1.1rem; font-size: .7rem; }
  }

  /* small phones */
  @media (max-width: 420px) {
    .hero { padding: 12px 10px 32px; }
    .hero-frame { border-width: 8px; }
    .hwh-btn--red { padding: .75rem 1.5rem; font-size: .78rem; }
  }
</style>
</head>
